# Permission Protocol — starter policy for sandbox-template
# Speed with brakes: auto-clear safe AI changes, require signing on risky ones.

version: 1

auto_clear:
  description: Safe AI-authored changes that auto-pass under policy.
  conditions:
    - actor_is_ai: true
    - tests_pass: true
  paths:
    - "docs/**"
    - "**/*.md"
    - "src/lib/utils.ts"

require_signing:
  description: Consequential AI-authored changes that need a human signer.
  reason: "Touches deploy workflow, infrastructure, migrations, or billing surface."
  paths:
    - ".github/workflows/**"
    - "migrations/**"
    - "src/api/billing.ts"

deny:
  description: Patterns that are blocked outright — fix the diff to proceed.
  rules:
    - migration_without_rollback
    - drop_table_without_archive_first
    - hardcoded_secrets

# Note: this policy is enforced by Permission Protocol's required check
# (context: permission-protocol/approval). Edit this file to change the rules,
# then commit. The policy file is itself a require_signing path.
